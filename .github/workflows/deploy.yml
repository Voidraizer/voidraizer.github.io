name: Deploy Land Page and Quartz Blog

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Install Dependencies & Build Quartz
              run: |
                cd pages/bali/quartz
                npm ci
                npx quartz plugin install --from-config
                npx quartz build

            - name: Move Quartz output to the blog root
              run: |
                mkdir -p pages/bali
                cp -r pages/bali/quartz/public/* pages/bali/

            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: "."
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        steps:
          - name: Deploy to Github Pages
            id: deployment
            uses: actions/deploy-pages@v4
